<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Riverside Clinic — Book an appointment</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#1A1D1B',
          paper: '#FAFAF8',
          teal: { DEFAULT: '#1F6F5C', soft: '#E4EDE9' },
          amber: '#C9762B'
        },
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-paper text-ink font-sans min-h-screen">

  <!-- aria-live region: all agent tool actions get announced here -->
  <div id="announcer" aria-live="polite" class="sr-only"></div>

  <header class="border-b border-ink/10 px-6 py-5">
    <h1 class="text-xl font-semibold tracking-tight">Riverside Clinic</h1>
    <p class="text-sm text-ink/60">Book an appointment</p>
  </header>

  <main class="max-w-2xl mx-auto px-6 py-8 space-y-10">

    <!-- Provider search -->
    <section aria-labelledby="provider-heading">
      <h2 id="provider-heading" class="text-sm font-medium text-ink/60 mb-3">Provider</h2>
      <div id="provider-panel" class="rounded-lg border border-ink/10 p-4 transition-shadow">
        <p id="provider-empty" class="text-ink/50 text-sm">No provider selected yet.</p>
        <div id="provider-result" class="hidden">
          <p class="font-medium" id="provider-name"></p>
          <p class="text-sm text-ink/60" id="provider-specialty"></p>
        </div>
      </div>
    </section>

    <!-- Calendar: the intentionally inaccessible widget -->
    <section aria-labelledby="calendar-heading">
      <h2 id="calendar-heading" class="text-sm font-medium text-ink/60 mb-1">Choose a time</h2>
      <p class="text-xs text-ink/40 mb-3">Drag an available slot onto a day to select it.</p>
      <div id="calendar-panel" class="rounded-lg border border-ink/10 p-4 transition-shadow">
        <div id="calendar-grid" class="grid grid-cols-3 gap-2" role="presentation">
          <!-- populated by calendar.js -->
        </div>
        <div id="slot-tray" class="flex flex-wrap gap-2 mt-4 pt-4 border-t border-ink/10" role="presentation">
          <!-- draggable slot chips populated by calendar.js -->
        </div>
      </div>
      <p id="selected-slot-readout" class="text-sm text-teal mt-2 font-medium" aria-hidden="true"></p>
    </section>

    <!-- Intake form -->
    <section aria-labelledby="intake-heading">
      <h2 id="intake-heading" class="text-sm font-medium text-ink/60 mb-3">Visit details</h2>
      <div id="intake-panel" class="rounded-lg border border-ink/10 p-4 space-y-3 transition-shadow">
        <div>
          <label for="reason-input" class="block text-sm text-ink/70 mb-1">Reason for visit</label>
          <input id="reason-input" type="text" class="w-full rounded border border-ink/20 px-3 py-2 text-sm"
                 placeholder="e.g. Annual check-up" />
        </div>
        <div>
          <label for="notes-input" class="block text-sm text-ink/70 mb-1">Notes (optional)</label>
          <textarea id="notes-input" class="w-full rounded border border-ink/20 px-3 py-2 text-sm" rows="2"
                    placeholder="Anything the provider should know"></textarea>
        </div>
      </div>
    </section>

    <!-- Submit -->
    <section>
      <button id="submit-button" disabled
        class="rounded-lg bg-teal text-white px-5 py-2.5 text-sm font-medium disabled:opacity-40 disabled:cursor-not-allowed">
        Book appointment
      </button>
      <p id="booking-status" class="text-sm text-ink/60 mt-2" role="status"></p>
    </section>

  </main>

  <!-- Confirmation modal: the human-control gate. Only a real click here completes a booking. -->
  <div id="confirm-modal" class="hidden fixed inset-0 bg-ink/40 flex items-center justify-center p-6" role="dialog" aria-modal="true" aria-labelledby="confirm-heading">
    <div class="bg-paper rounded-lg max-w-sm w-full p-6 shadow-xl">
      <h2 id="confirm-heading" class="font-semibold mb-2">Confirm booking</h2>
      <p id="confirm-summary" class="text-sm text-ink/70 mb-5"></p>
      <div class="flex gap-3">
        <button id="confirm-yes" class="flex-1 rounded-lg bg-teal text-white px-4 py-2 text-sm font-medium">Confirm</button>
        <button id="confirm-no" class="flex-1 rounded-lg border border-ink/20 px-4 py-2 text-sm font-medium">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
